name: Bug 反馈 / Bug report
description: 放大、轮次列表、输入框、公式显示出问题时用这个
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        先感谢反馈。**截图 + 复现步骤**能省掉一半来回。
        面板里点「反馈」按钮会自动带上版本信息，也可以手动填。
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么？和你的预期差在哪？
      placeholder: 例如：点第 4 轮的放大按钮，打开的却是第 3 轮的内容
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开会话，滚动到第 4 轮
        2. 点该轮操作行的「放大」
        3. 观察右栏内容
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截图 / 录屏
      description: 直接拖进来即可（GitHub 会自动上传）
  - type: input
    id: version
    attributes:
      label: 插件版本
      description: 面板右上角或按钮悬停提示里的 v0.x.y；也可以在 DevTools 里执行 `__DSH_READ_ZOOM__.peek().version`
      placeholder: v0.4.0
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DSH 版本
      placeholder: 0.2.2-rc.1
  - type: dropdown
    id: os
    attributes:
      label: 系统
      options: [Windows, macOS, Linux]
  - type: textarea
    id: diag
    attributes:
      label: 诊断信息（可选）
      description: DevTools 控制台执行 `JSON.stringify(__DSH_READ_ZOOM__.peek())`，把结果贴进来；再点面板里的「复制诊断」更好
      render: json
